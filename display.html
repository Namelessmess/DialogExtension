<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>RPG Dialog</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      background: transparent !important;
      pointer-events: none;
      font-family: 'Segoe UI', 'Georgia', sans-serif;
      overflow: hidden;
    }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(200,170,110,0.4); border-radius: 2px; }

    /* Füllt das gesamte Popover, Box klebt unten.
       padding-bottom MUSS mit DIALOG_INNER_BOTTOM in main.js übereinstimmen (= 10px) */
    #dialog-root {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: flex-end;
      padding: 0 12px 10px 12px;
    }

    /* -- Dialogbox -- */
    /* FESTE HÖHE 160px = DIALOG_BOX_H in main.js — nicht ändern ohne
       DIALOG_BOX_H dort ebenfalls anzupassen! 
       Nur eine feste Höhe macht die Portrait-Positionsberechnung in main.js zuverlässig. */
    #dialog-box {
      display: none;
      flex-direction: column;
      height: 160px;          /* DIALOG_BOX_H */
      flex-shrink: 0;
      position: relative;
      width: 100%;
      background: rgba(8, 6, 4, 0.93);
      backdrop-filter: blur(14px) saturate(1.2);
      -webkit-backdrop-filter: blur(14px) saturate(1.2);
      border: 2px solid #c8aa6e;
      border-radius: 8px;
      padding: 13px 40px 13px 16px;
      pointer-events: auto;
      color: #f0ead8;
      box-shadow:
        0 0 0 1px rgba(200,170,110,0.18),
        0 -4px 30px rgba(0,0,0,0.65),
        inset 0 1px 0 rgba(200,170,110,0.12);
    }

    #dialog-box::before {
      content: '';
      position: absolute;
      inset: 4px;
      border: 1px solid rgba(200,170,110,0.13);
      border-radius: 5px;
      pointer-events: none;
    }

    #speaker-name {
      flex-shrink: 0;
      display: block;
      font-weight: 700;
      font-size: 1em;
      color: #c8aa6e;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      margin-bottom: 5px;
      text-shadow: 0 1px 6px rgba(0,0,0,0.8);
    }

    #log-scroll {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .log-entry-old {
      opacity: 0.4;
      font-size: 0.88em;
      line-height: 1.5;
      color: #c8b890;
      border-bottom: 1px solid rgba(200,170,110,0.1);
      padding-bottom: 3px;
      white-space: pre-wrap;
    }

    #text-content {
      font-size: 1.02em;
      line-height: 1.65;
      color: #ede8dc;
      text-shadow: 0 1px 4px rgba(0,0,0,0.9);
      white-space: pre-wrap;
    }

    .chunk { display: inline; }
    .chunk.typing::after {
      content: "▌";
      color: #c8aa6e;
      animation: blink 0.75s step-end infinite;
      margin-left: 1px;
    }
    @keyframes blink { 50% { opacity: 0; } }

    #close-btn {
      position: absolute;
      top: 9px; right: 13px;
      cursor: pointer;
      pointer-events: auto;
      color: #6a5a38;
      font-size: 0.9em;
      transition: color 0.2s, transform 0.1s;
      user-select: none;
      z-index: 12;
    }
    #close-btn:hover  { color: #c8aa6e; transform: scale(1.15); }
    #close-btn:active { transform: scale(0.9); }
  </style>
</head>
<body>
  <div id="dialog-root">
    <div id="dialog-box">
      <span id="close-btn">✕</span>
      <span id="speaker-name"></span>
      <div id="log-scroll">
        <div id="text-content"></div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/display.js"></script>
</body>
</html>
