<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>RPG Portrait</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      background: transparent !important;
      pointer-events: none !important;
      overflow: hidden;
      cursor: none;
    }

    /* Das Bild füllt das exakt bemessene Popover-Fenster komplett aus */
    #portrait-img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: bottom center;
      pointer-events: none;
      transform-origin: bottom center;
      transition: filter 0.3s ease, transform 0.3s ease;
    }

    /* Aktiver Sprecher */
    #portrait-img.active {
      filter: drop-shadow(0 6px 24px rgba(200,170,110,0.5))
              brightness(1.07) saturate(1.05);
    }

    /* Inaktiver Charakter: ausgegraut */
    #portrait-img.inactive {
      filter: drop-shadow(0 4px 10px rgba(0,0,0,0.5))
              brightness(0.35) saturate(0.3) grayscale(0.3);
    }
  </style>
</head>
<body>
  <img id="portrait-img" src="" alt="">
  <script type="module" src="/src/portrait.js"></script>
</body>
</html>
